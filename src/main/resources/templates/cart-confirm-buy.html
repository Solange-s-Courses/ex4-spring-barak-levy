<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Confirm Cart Purchase</title>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
</head>
<body>

<div th:replace="headers/menu :: menu"></div>

<div class="container mt-5">

    <div class="card">
        <div class="card-header bg-success text-white text-center">
            <h4>Confirm Cart Purchase</h4>
        </div>
        <div class="card-body">

            <div th:if="${#lists.isEmpty(cartItems)}" class="text-center">
                <p>Your cart is empty.</p>
                <a href="/products" class="btn btn-primary">Continue Shopping</a>
            </div>

            <div th:if="${!#lists.isEmpty(cartItems)}">
                <table class="table table-bordered table-hover text-center">
                    <thead class="table-light">
                    <tr>
                        <th>Product</th>
                        <th>Quantity</th>
                        <th>Unit Price</th>
                        <th>Total</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item : ${cartItems}">
                        <td th:text="${item.productName}">Product Name</td>
                        <td th:text="${item.quantity}">1</td>
                        <td th:text="${item.price} + ' ₪'">0.00 ₪</td>
                        <td th:text="${item.price * item.quantity} + ' ₪'">0.00 ₪</td>
                    </tr>
                    </tbody>
                </table>

                <h5 class="text-end">
                    Total: <span th:text="${total} + ' ₪'">0.00 ₪</span>
                </h5>

                <form th:action="@{/orders/buy-from-cart}" method="post" class="text-center mt-4">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit" class="btn btn-success me-2">Confirm Purchase</button>
                    <a href="/cart" class="btn btn-secondary">Back to Cart</a>
                </form>
            </div>

        </div>
    </div>

</div>

</body>
</html>
