<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Your Shopping Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>

<div th:replace="headers/menu :: menu"></div>

<div class="container mt-5">

    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

    <div class="card">
        <div class="card-header bg-info text-white text-center">
            <h1>Your Shopping Cart</h1>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(cartItems)}">
        <p>Your cart is empty.</p>
        <a href="/products" class="btn btn-primary">Continue Shopping</a>
    </div>

    <div th:if="${!#lists.isEmpty(cartItems)}">
        <table class="table table-bordered mt-3">
            <thead class="table-light">
            <tr>
                <th>Product Name</th>
                <th>Quantity</th>
                <th>Update Buying Quantity</th>
                <th>Price per unit</th>
                <th>Total Price</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${cartItems}">
                <td th:text="${item.productName}">Product Name</td>

                <td>
                    <form th:action="@{/cart/update}" method="post" class="d-flex align-items-center gap-2">
                        <input type="hidden" name="productId" th:value="${item.productId}" />

                        <input type="number"
                               name="quantity"
                               th:value="${item.quantity}"
                               min="1"
                               th:attr="max=${item.availableQuantity}"
                               class="form-control form-control-sm"
                               style="width: 80px;" />

                        <button type="submit" class="btn btn-primary btn-sm">Update</button>

                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    </form>
                    <small class="text-muted" th:text="'In stock: ' + ${item.availableQuantity}"></small>
                </td>

                <td th:text="${item.quantity}">1</td>
                <td th:text="${item.price} + ' ₪'">0.00 ₪</td>
                <td th:text="${item.price * item.quantity} + ' ₪'">0.00 ₪</td>
                <td>
                    <form th:action="@{'/cart/remove/' + ${item.productId}}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="btn btn-danger btn-sm">Remove</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

        <h4>Total: <span th:text="${total} + ' ₪'">0.00 ₪</span></h4>

        <form th:action="@{/cart/clear}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button type="submit" class="btn btn-warning">Clear Cart</button>
        </form>

        <br />
        <a href="/products" class="btn btn-secondary">Continue Shopping</a>
        <a href="/cart/confirm" class="btn btn-success">Proceed to Checkout</a>
    </div>
</div>

</body>
</html>
