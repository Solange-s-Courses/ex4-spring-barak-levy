<!DOCTYPE html>
<html xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>My Orders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="headers/menu :: menu"></div>

<div class="container mt-5">
    <div class="card">
        <div class="card-header bg-success text-white text-center">
            <h1>My Orders</h1>
        </div>
    </div>

    <br>
    <div th:if="${orders.isEmpty()}">
        <p>You haven't made any purchases yet.</p>
    </div>

    <div th:unless="${orders.isEmpty()}">
        <table class="table table-bordered">
            <thead>
            <tr>
                <th>Product</th>
                <th>Quantity</th>
                <th>Total Price</th>
                <th>Purchase Date</th>

                <th sec:authorize="hasRole('USER')">Seller Company</th>

                <th sec:authorize="hasRole('COMPANY')">Buyer</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="order : ${orders}">
                <td th:text="${order.product?.name}">Product Name</td>
                <td th:text="${order.quantityPurchased}">Quantity</td>
                <td th:text="${order.totalPrice} + ' ₪'">Price</td>
                <td th:text="${#temporals.format(order.purchaseDate, 'yyyy-MM-dd HH:mm')}">Date</td>

                <td sec:authorize="hasRole('USER')"
                    th:text="${order.sellerCompany?.userName}">Company Name
                </td>

                <td sec:authorize="hasRole('COMPANY')"
                        th:text="${order.buyer?.userName}">User Name
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <a href="/" class="btn btn-primary mt-3">Back to Home</a>
</div>

</body>
</html>
