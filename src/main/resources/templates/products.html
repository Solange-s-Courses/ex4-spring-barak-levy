<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Products</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1 class="mb-4 text-center">Products</h1>

    <form method="get" action="/products" class="mb-4">
        <div class="row g-2 align-items-center">

            <div class="col-auto">
                <label for="category" class="col-form-label">Category:</label>
            </div>
            <div class="col-auto">
                <select name="category" id="category" class="form-select">
                    <option value="">All</option>
                    <option th:each="cat : ${categories}"
                            th:value="${cat}"
                            th:text="${cat}"
                            th:selected="${cat == selectedCategory}">Category</option>
                </select>
            </div>

            <div class="col-auto">
                <label for="name" class="col-form-label">Name:</label>
            </div>
            <div class="col-auto">
                <input type="text" name="name" id="name" class="form-control" th:value="${searchName}">
            </div>

            <div class="col-auto">
                <button type="submit" class="btn btn-primary">Filter</button>
            </div>
        </div>
    </form>

    <div class="row row-cols-1 row-cols-md-3 g-4">
        <div class="col" th:each="product : ${products}">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title" th:text="${product.name}">Product Name</h5>
                    <p class="card-text" th:text="${product.description}">Product Description</p>
                    <p class="card-text fw-bold text-primary">$<span th:text="${product.price}">0.00</span></p>
                </div>
                <div class="card-footer text-end">
                    <button class="btn btn-primary btn-sm">Buy Now</button>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
