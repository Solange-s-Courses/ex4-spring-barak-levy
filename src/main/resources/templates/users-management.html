<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>All Users</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

<div th:replace="headers/menu :: menu"></div>

<div class="container mt-5">
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card">
        <div class="card-header bg-info text-white text-center">
            <h1>All Users</h1>
        </div>
    </div>

    <table class="table table-bordered table-hover mt-3">
        <thead class="table-light">
        <tr>
            <th>Name</th>
            <th>Type</th>
            <th>Email</th>
            <th>User Access</th>
            <th>Toggle Access</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${users}">
            <td th:text="${user.userName}">Name</td>
            <td th:text="${user.role}">Role</td>
            <td th:text="${user.email}">Email</td>
            <td th:text="${!user.accessLocked ? '✔' : '✖'}">User Access</td>
            <td>
                <form th:action="@{'/admin/toggle-user-access/' + ${user.id}}" method="post" class="d-inline">
                    <input type="hidden" name="accessLocked" th:value="${!user.accessLocked}" />
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit"
                            class="btn btn-sm"
                            th:classappend="${user.accessLocked} ? 'btn-success' : 'btn-danger'"
                            th:text="${user.accessLocked} ? 'Unlock Access' : 'Lock Access'">
                    </button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(users)}">
            <td colspan="4" class="text-center text-muted">No users found.</td>
        </tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
