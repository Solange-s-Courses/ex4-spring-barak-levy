<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>All Users</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

<div th:replace="headers/menu :: menu"></div>

<div class="container mt-5">
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card">
        <div class="card-header bg-info text-white text-center">
            <h1>All Users</h1>
        </div>
    </div>

    <table class="table table-bordered table-hover mt-3">
        <thead class="table-light">
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>User Access</th>
            <th>Toggle Access</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${users}">
            <td th:text="${user.userName}">Name</td>
            <td th:text="${user.email}">Email</td>
            <td th:text="${!user.accessLocked ? '✔' : '✖'}">User Access</td>
            <td>
                <button type="button"
                        class="btn btn-sm"
                        th:classappend="${user.accessLocked} ? 'btn-success' : 'btn-danger'"
                        th:text="${user.accessLocked} ? 'Unlock Access' : 'Lock Access'"
                        th:onclick="'toggleAccess(' + ${user.id} + ',' + ${user.accessLocked} + ')'"
                >
                </button>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(users)}">
            <td colspan="4" class="text-center text-muted">No users found.</td>
        </tr>
        </tbody>
    </table>
</div>

<script>
    function toggleAccess(userId, currentLocked) {
        fetch(`/api/users/${userId}`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                accessLocked: !currentLocked
            })
        }).then(res => {
            if (res.ok) {
                location.reload();
            } else {
                alert("Failed to update user access.");
            }
        });
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
