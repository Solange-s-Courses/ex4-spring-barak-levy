<!DOCTYPE html>
<html xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Menu</title>
</head>
<body>
<div th:fragment="menu">
    <div class="container mt-5">

        <div class="text-center my-4 bg-primary text-white py-3 rounded">
            <h1>The Electronic Products Shop</h1>
        </div>

        <div class="d-flex gap-2 mb-4 align-items-center">
            <a th:href="@{/products}" class="btn btn-primary">Products</a>

            <a sec:authorize="hasRole('COMPANY')" th:href="@{/products/my-products}"
               class="btn btn-primary">My Products</a>

            <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/products-management}"
               class="btn btn-primary">Products Management</a>

            <a sec:authorize="hasAnyRole('USER', 'COMPANY')"
               th:href="@{/orders/my-orders}" class="btn btn-primary">Orders</a>

            <a sec:authorize="hasAnyRole('ADMIN')"
               th:href="@{/admin/all-orders}" class="btn btn-primary">Orders</a>

            <a sec:authorize="hasAnyRole('ADMIN')"
               th:href="@{/admin/users-management}" class="btn btn-primary">Users Management</a>

            <a th:href="@{/profile}" class="btn btn-primary">Profile</a>

            <div class="ms-auto">
                <form th:action="@{/logout}" method="post">
                    <input type="submit" value="Logout" class="btn btn-danger"/>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
