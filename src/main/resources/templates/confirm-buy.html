<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Confirm Purchase</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body>

<div class="container mt-5">
    <div class="card">
        <div class="card-header bg-warning text-white">
            <h4 class="text-center">Confirm Purchase</h4>
        </div>
        <div class="card-body text-center">
            <form th:action="@{/orders/buy}" method="post" id="purchaseForm">
                <div class="mb-4">
                    <h5 th:text="'Product: ' + ${product.name}">Product Name</h5>
                    <p>
                        Unit Price: ₪
                        <span id="unitPrice" th:text="${product.price}"
                              th:attr="data-price=${product.price}">0.00</span>
                    </p>

                    <div class="d-flex justify-content-center align-items-center gap-2 mb-3">
                        <label for="quantityInput" class="form-label mb-0">Quantity:</label>
                        <input type="number" id="quantityInput" class="form-control text-center"
                               min="1" value="1" style="width: 100px;" />
                    </div>

                    <h5>
                        Total Price: ₪<span id="totalPrice" th:text="${product.price}">0.00</span>
                    </h5>
                </div>

                <!-- Hidden inputs for form submission -->
                <input type="hidden" name="productId" th:value="${product.id}" />
                <input type="hidden" name="quantity" id="hiddenQuantity" value="1" />
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="d-flex justify-content-center gap-3">
                    <button type="submit" class="btn btn-success">Buy</button>
                    <a th:href="@{/products}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const quantityInput = document.getElementById("quantityInput");
        const unitPriceElement = document.getElementById("unitPrice");
        const totalPriceElement = document.getElementById("totalPrice");
        const hiddenQuantityInput = document.getElementById("hiddenQuantity");

        const pricePerUnit = parseFloat(unitPriceElement.dataset.price);

        function updateTotal() {
            const quantity = Math.max(1, parseInt(quantityInput.value) || 1);
            const total = (pricePerUnit * quantity).toFixed(2);
            totalPriceElement.textContent = total;
            hiddenQuantityInput.value = quantity;
        }

        quantityInput.addEventListener("input", updateTotal);

        updateTotal();
    });
</script>

</body>
</html>
