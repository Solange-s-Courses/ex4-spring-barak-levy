<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Confirm Purchase</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body>

<div class="container mt-5">
    <div class="card">
        <div class="card-header bg-warning text-white">
            <h4 class="text-center">Confirm Purchase</h4>
        </div>
        <div class="card-body text-center">
            <p>
                Are you sure you want to buy <strong th:text="${product.name}">Product</strong>
                x <strong th:text="${quantity}">1</strong> for
                <strong>$<span th:text="${totalPrice}">0.00</span></strong>?
            </p>
            <form th:action="@{/orders/buy}" method="post">
                <input type="hidden" name="productId" th:value="${product.id}"/>
                <input type="hidden" name="quantity" th:value="${quantity}"/>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button class="btn btn-success" type="submit">Buy</button>
                <a th:href="@{/products}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>

</body>
</html>
