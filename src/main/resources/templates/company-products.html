<!DOCTYPE html>
<html xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>My Products</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

<div th:replace="headers/menu :: menu"></div>

<div class="container mt-5">
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card">
        <div class="card-header bg-info text-white text-center">
            <h1 sec:authorize="hasRole('COMPANY')">My Products</h1>
            <h1 sec:authorize="hasRole('ADMIN')">All Products</h1>
        </div>
    </div>

    <br>
    <div sec:authorize="hasRole('COMPANY')" class="mb-3">
        <a th:href="@{/products/management}" class="btn btn-success">Add New Product</a>
    </div>

    <table class="table table-bordered table-hover">
        <thead class="table-light">
        <tr>
            <th>Name</th>
            <th sec:authorize="hasRole('ADMIN')">Company</th>
            <th>Category</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Description</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="product : ${products}">
            <td th:text="${product.name}">Product Name</td>
            <td sec:authorize="hasRole('ADMIN')" th:text="${product.company.userName}">Company</td>
            <td th:text="${product.category.displayName}">Category</td>
            <td th:text="${product.price}">0</td>
            <td th:text="${product.quantity}">0</td>
            <td th:text="${product.description}">Description</td>
            <td>
                <a sec:authorize="hasRole('COMPANY')" th:href="@{'/products/edit/' + ${product.id}}" class="btn btn-sm btn-success">Edit</a>

                <button type="button"
                        class="btn btn-sm btn-danger"
                        data-bs-toggle="modal"
                        th:attr="data-bs-target='#deleteModal_' + ${product.id}">
                    Delete
                </button>

                <div class="modal fade"
                     th:id="'deleteModal_' + ${product.id}"
                     tabindex="-1"
                     aria-labelledby="deleteModalLabel"
                     aria-hidden="true">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <form th:action="@{'/products/delete/' + ${product.id}}" method="post" th:object="${product}">
                                <div class="modal-header">
                                    <h5 class="modal-title" id="deleteModalLabel">Confirm Deletion</h5>
                                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                </div>
                                <div class="modal-body">
                                    Are you sure you want to delete this product?
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                                    <button type="submit" class="btn btn-danger">Yes, Delete</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(products)}">
            <td colspan="6" class="text-center text-muted">No products found.</td>
        </tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
