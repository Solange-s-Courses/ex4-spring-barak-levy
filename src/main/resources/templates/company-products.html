<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Products</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

<div th:replace="headers/menu :: menu"></div>

<div class="container mt-5">

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card">
        <div class="card-header bg-info text-white text-center">
            <h1>My Products</h1>
        </div>
    </div>

    <br>
    <div class="mb-3">
        <a th:href="@{/products/management}" class="btn btn-success">Add New Product</a>
    </div>

    <table class="table table-bordered table-hover">
        <thead class="table-light">
        <tr>
            <th>Name</th>
            <th>Category</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Description</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="product : ${products}">
            <td th:text="${product.name}">Product Name</td>
            <td th:text="${product.category}">Category</td>
            <td th:text="${product.price}">0</td>
            <td th:text="${product.quantity}">0</td>
            <td th:text="${product.description}">Description</td>
            <td>
                <a th:href="@{'/products/edit/' + ${product.id}}" class="btn btn-sm btn-success">Edit</a>
                <form th:action="@{'/products/delete/' + ${product.id}}" method="post" th:object="${product}" style="display:inline;">
                    <button type="submit" class="btn btn-sm btn-danger"
                            onclick="return confirm('Are you sure you want to delete this product?');">
                        Delete</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(products)}">
            <td colspan="5" class="text-center text-muted">No products found.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
