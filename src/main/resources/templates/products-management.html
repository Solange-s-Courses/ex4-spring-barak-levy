<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="${isEdit} ? 'Edit Product' : 'Create New Product'">Product Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="headers/menu :: menu"></div>

<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card shadow p-4" style="width: 100%; max-width: 400px;">
        <h3 class="text-center mb-4" th:text="${isEdit} ? 'Edit Product' : 'Create New Product'">Form Title</h3>

        <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

        <form th:action="${isEdit} ? @{'/products/edit/' + ${product.id}} : @{/products/add}" method="post">

            <div class="mb-3">
                <label for="category" class="form-label">Select Category</label>
                <select class="form-select" id="category" name="category" required>
                    <option value="" disabled th:if="${!isEdit}" selected>Select Category</option>
                    <option value="SMARTPHONES" th:selected="${product?.category?.name() == 'SMARTPHONES'}">Smartphones</option>
                    <option value="COMPUTERS" th:selected="${product?.category?.name() == 'COMPUTERS'}">Computers</option>
                    <option value="TV" th:selected="${product?.category?.name() == 'TV'}">TV</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="productName" class="form-label">Name</label>
                <input type="text" class="form-control" id="productName" name="productName"
                       th:value="${product?.name}" required>
            </div>

            <div class="mb-3">
                <label for="price" class="form-label">Price</label>
                <input type="number" class="form-control" id="price" name="price"
                       th:value="${product?.price}" required>
            </div>

            <div class="mb-3">
                <label for="quantity" class="form-label">Quantity</label>
                <input type="number" class="form-control" id="quantity" name="quantity"
                       th:value="${product?.quantity}" required>
            </div>

            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <input type="text" class="form-control" id="description" name="description"
                       th:value="${product?.description}" required>
            </div>

            <div class="mb-3">
                <label for="imageUrl" class="form-label">Image Url</label>
                <input type="text" class="form-control" id="imageUrl" name="description"
                       th:value="${product?.imageUrl}">
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-primary" th:text="${isEdit} ? 'Update Product' : 'Create Product'">Submit</button>
            </div>

        </form>

        <p class="mt-3 text-center">
            <a class="btn btn-primary" th:href="@{/products/my-products}" th:text="'Back to my products'"></a>
        </p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
