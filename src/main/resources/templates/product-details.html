<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="${product.name}">Product Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="headers/menu :: menu"></div>

<div class="container mt-5">

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card">
        <div class="card-header bg-warning text-white text-center">
            <h1 th:text="${product.name}">Product Name</h1>
        </div>
    </div>

    <img th:src="${product.imageUrl}" class="card-img-top" alt="Product Image"
         style="object-fit: contain; height: 200px; width: 100%; background-color: #f8f9fa;">

    <br>
    <h5>Category: <span th:text="${product.category}"></span></h5>

    <br>
    <h5 th:text="${product.description}">Product Description</h5>

    <br>
    <h5>Price: <span class="text-success" th:text="${product.price} + ' ₪'">0.00 ₪</span></h5>

    <br>
    <h5>Rating: <span th:text="${#numbers.formatDecimal(averageRating, 1, 1)}">0.0</span>
        <span th:each="i : ${#numbers.sequence(1, 5)}"
              th:text="${i <= (averageRating - i + 1 >= 0.5 ? T(java.lang.Math).ceil(averageRating) : T(java.lang.Math).floor(averageRating)) ? '★' : '☆'}"
              style="color: gold;"></span>
    </h5>

    <br>
    <h5>Products left in stock: <span th:text="${product.quantity}"></span></h5>

    <br>

    <form th:action="@{/cart/add/{id}(id=${product.id})}" method="post" style="display: inline;">
        <input type="hidden" name="quantity" value="1" />
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <button sec:authorize="hasAnyRole('USER')" type="submit"
                class="btn btn-info btn-sm me-2 float-start">
            Add to Cart
        </button>
    </form>

    <form th:action="@{/orders/confirm}" method="post">
        <input type="hidden" name="productId" th:value="${product.id}" />
        <input type="hidden" name="quantity" value="1" />
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <button sec:authorize="hasAnyRole('USER')"
                class="btn btn-primary btn-sm" type="submit">Buy Now</button>
    </form>

    <br>
    <div class="card">
        <div class="card-header bg-info text-white text-center">
            <h2>Reviews</h2>
        </div>
    </div>

    <br>
    <div th:if="${#lists.isEmpty(reviews)}">
        <p>No reviews yet.</p>
    </div>
    <div class="card h-100 shadow-sm">
        <div class="card-body">
            <div th:each="review : ${reviews}">
                <p>
                    <strong th:text="${review.reviewer?.userName}">User Name</strong> rated it:
                    <span th:text="${review.rating} + '/5'"></span>
                    <span th:each="i : ${#numbers.sequence(1, 5)}"
                          th:text="${i <= review.rating ? '★' : '☆'}"
                          style="color: gold;"></span>
                </p>
                <p th:text="${review.comment}">Review Comment</p>
                <hr>
            </div>
        </div>
    </div>

    <div th:if="${canReview}">
        <br>
        <div class="card">
            <div class="card-header bg-danger text-white text-center">
                <h2 th:text="${userReview != null ? 'Edit Your Review' : 'Add a Review'}">Review Form</h2>
            </div>
        </div>

        <br>
        <form th:action="@{'/products/product-page/' + ${product.id} + '/review'}" method="post">
            <div class="mb-3">
                <label for="rating" class="form-label"></label>

                <h5><strong>Rating</strong></h5>

                <div id="dynamicStars" class="mb-2" style="font-size: 1.5rem; color: gold;">
                    <span>☆</span><span>☆</span><span>☆</span><span>☆</span><span>☆</span>
                </div>

                <select id="rating" name="rating" class="form-select">
                    <option th:each="i : ${#numbers.sequence(1,5)}"
                            th:value="${i}"
                            th:text="${i}"
                            th:selected="${userReview != null and userReview.rating == i}">1</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="comment" class="form-label"></label>

                <h5><strong>Comment</strong></h5>

                <textarea id="comment" name="comment" class="form-control" rows="3"
                          th:text="${userReview != null ? userReview.comment : ''}"></textarea>
            </div>
            <button type="submit" class="btn btn-primary"
                    th:text="${userReview != null ? 'Update Review' : 'Submit Review'}">Submit Review</button>
        </form>
    </div>

    <br>
    <div th:if="${!canReview}">
        <p sec:authorize="hasAnyRole('USER')">You must purchase this product to leave a review.</p>
    </div>

    <a href="/products" class="btn btn-secondary mt-3">Back to Products</a>
</div>

<script>
    function updateStars(value) {
        const stars = document.getElementById('dynamicStars').children;
        for (let i = 0; i < 5; i++) {
            stars[i].textContent = i < value ? '★' : '☆';
        }
    }

    window.onload = function () {
        const ratingSelect = document.getElementById('rating');
        const selected = ratingSelect.value;
        updateStars(selected);

        ratingSelect.addEventListener('change', function () {
            updateStars(this.value);
        });
    }
</script>

</body>
</html>
