<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${product.name}">Product Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="headers/menu :: menu"></div>

<div class="container mt-5">
    <h1 th:text="${product.name}">Product Name</h1>
    <p th:text="${product.description}">Product Description</p>
    <p>Price: <span th:text="${product.price}">0.00</span> ₪</p>

    <h2>Reviews</h2>
    <div th:if="${#lists.isEmpty(reviews)}">
        <p>No reviews yet.</p>
    </div>
    <div th:each="review : ${reviews}">
        <p><strong th:text="${review.reviewer?.userName}">User Name</strong> rated it <span th:text="${review.rating}">0</span>/5</p>
        <p th:text="${review.comment}">Review Comment</p>
        <hr>
    </div>

    <div th:if="${canReview}">
        <h3>Add a Review</h3>
        <form th:action="@{'/products/' + ${product.id} + '/review'}" method="post">
            <div class="mb-3">
                <label for="rating" class="form-label">Rating</label>
                <select id="rating" name="rating" class="form-select">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="comment" class="form-label">Comment</label>
                <textarea id="comment" name="comment" class="form-control" rows="3"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Submit Review</button>
        </form>
    </div>
    <div th:if="${!canReview}">
        <p>You must purchase this product to leave a review.</p>
    </div>

    <a href="/products" class="btn btn-secondary mt-3">Back to Products</a>
</div>

</body>
</html>
